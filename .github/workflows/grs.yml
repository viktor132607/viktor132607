name: Update GitHub Stats

on:
  push:
    paths:
      - ".github/workflows/grs.yml"
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Generate GitHub Stats
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=viktor132607&show_icons=true&theme=default&bg_color=ffffff&hide_border=true&number_format=long
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Top Languages
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=viktor132607&layout=compact&theme=default&bg_color=ffffff&hide_border=true
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate portfolio GitHub data
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p profile
          node <<'NODE'
          const fs = require("fs");

          const username = "viktor132607";
          const headers = {
            Accept: "application/vnd.github+json",
            Authorization: `Bearer ${process.env.GH_TOKEN}`,
            "X-GitHub-Api-Version": "2022-11-28"
          };

          async function github(path) {
            const response = await fetch(`https://api.github.com${path}`, { headers });
            if (!response.ok) {
              throw new Error(`GitHub API ${response.status}: ${path}`);
            }
            return response.json();
          }

          async function githubGraphQL(query, variables) {
            const response = await fetch("https://api.github.com/graphql", {
              method: "POST",
              headers: {
                ...headers,
                "Content-Type": "application/json"
              },
              body: JSON.stringify({ query, variables })
            });

            if (!response.ok) {
              throw new Error(`GitHub GraphQL ${response.status}`);
            }

            const result = await response.json();
            if (result.errors?.length) {
              throw new Error(result.errors.map((error) => error.message).join("; "));
            }

            return result.data;
          }

          async function getRepos() {
            const repos = [];
            for (let page = 1; ; page += 1) {
              const batch = await github(`/users/${username}/repos?per_page=100&page=${page}&sort=updated&type=owner`);
              repos.push(...batch);
              if (batch.length < 100) break;
            }
            return repos.filter((repo) => !repo.fork && !repo.archived);
          }

          async function getAllTimeCommitCount() {
            const yearsData = await githubGraphQL(
              `query($login: String!) {
                user(login: $login) {
                  contributionsCollection {
                    contributionYears
                  }
                }
              }`,
              { login: username }
            );

            const years = yearsData.user.contributionsCollection.contributionYears;
            let total = 0;
            const now = new Date();

            for (const year of years) {
              const from = `${year}-01-01T00:00:00Z`;
              const to = year === now.getUTCFullYear()
                ? now.toISOString()
                : `${year}-12-31T23:59:59Z`;

              const yearData = await githubGraphQL(
                `query($login: String!, $from: DateTime!, $to: DateTime!) {
                  user(login: $login) {
                    contributionsCollection(from: $from, to: $to) {
                      totalCommitContributions
                    }
                  }
                }`,
                { login: username, from, to }
              );

              total += yearData.user.contributionsCollection.totalCommitContributions;
            }

            return total;
          }

          function patchStatsCard(totalCommits) {
            const formatted = totalCommits.toLocaleString("en-US");
            let svg = fs.readFileSync("profile/stats.svg", "utf8");

            svg = svg.replace(
              /Total Commits\s*(?:\([^)]*\))?\s*:/g,
              "Total Commits (all time):"
            );

            svg = svg.replace(
              /(Total Commits \(all time\):)\s*[\d,]+/g,
              `$1 ${formatted}`
            );

            svg = svg.replace(
              /(data-testid="commits"[\s\S]*?>)\s*[\d,]+(\s*<\/text>)/,
              `$1${formatted}$2`
            );

            fs.writeFileSync("profile/stats.svg", svg);
          }

          async function main() {
            const [repos, totalCommits] = await Promise.all([
              getRepos(),
              getAllTimeCommitCount()
            ]);

            const languageTotals = new Map();
            const languageResults = await Promise.all(
              repos.map((repo) => github(`/repos/${username}/${repo.name}/languages`).catch(() => ({})))
            );

            for (const languages of languageResults) {
              for (const [name, bytes] of Object.entries(languages)) {
                languageTotals.set(name, (languageTotals.get(name) ?? 0) + Number(bytes));
              }
            }

            const totalBytes = [...languageTotals.values()].reduce((sum, bytes) => sum + bytes, 0);
            const languages = [...languageTotals.entries()]
              .map(([name, bytes]) => ({
                name,
                percent: totalBytes > 0 ? Math.round((bytes / totalBytes) * 100) : 0
              }))
              .filter((language) => language.percent > 0)
              .sort((a, b) => b.percent - a.percent)
              .slice(0, 5);

            patchStatsCard(totalCommits);

            const data = {
              repos: repos.length,
              totalCommits,
              commitPeriod: "allTime",
              languages,
              updatedAt: new Date().toISOString()
            };

            fs.writeFileSync("profile/github-stats.json", `${JSON.stringify(data, null, 2)}\n`);
          }

          main().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Commit generated stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/stats.svg profile/top-langs.svg profile/github-stats.json
          git commit -m "Update GitHub stats" || exit 0
          git push
