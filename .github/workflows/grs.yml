name: Update GitHub Stats

on:
  push:
    paths:
      - ".github/workflows/grs.yml"
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Generate GitHub Stats
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=viktor132607&show_icons=true&theme=default&bg_color=ffffff&hide_border=true&number_format=long
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate portfolio GitHub data and language card
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p profile
          node <<'NODE'
          const fs = require("fs");

          const username = "viktor132607";
          const headers = {
            Accept: "application/vnd.github+json",
            Authorization: `Bearer ${process.env.GH_TOKEN}`,
            "X-GitHub-Api-Version": "2022-11-28"
          };

          async function github(path) {
            const response = await fetch(`https://api.github.com${path}`, { headers });
            if (!response.ok) throw new Error(`GitHub API ${response.status}: ${path}`);
            return response.json();
          }

          async function githubGraphQL(query, variables) {
            const response = await fetch("https://api.github.com/graphql", {
              method: "POST",
              headers: { ...headers, "Content-Type": "application/json" },
              body: JSON.stringify({ query, variables })
            });
            if (!response.ok) throw new Error(`GitHub GraphQL ${response.status}`);
            const result = await response.json();
            if (result.errors?.length) throw new Error(result.errors.map((e) => e.message).join("; "));
            return result.data;
          }

          async function getRepos() {
            const repos = [];
            for (let page = 1; ; page += 1) {
              const batch = await github(`/users/${username}/repos?per_page=100&page=${page}&sort=updated&type=owner`);
              repos.push(...batch);
              if (batch.length < 100) break;
            }
            return repos.filter((repo) => !repo.fork && !repo.archived);
          }

          async function getAllTimeContributionCount() {
            const yearsData = await githubGraphQL(
              `query($login: String!) { user(login: $login) { contributionsCollection { contributionYears } } }`,
              { login: username }
            );
            const years = yearsData.user.contributionsCollection.contributionYears;
            let total = 0;
            const byYear = {};
            const now = new Date();

            for (const year of years) {
              const from = `${year}-01-01T00:00:00Z`;
              const to = year === now.getUTCFullYear() ? now.toISOString() : `${year}-12-31T23:59:59Z`;
              const yearData = await githubGraphQL(
                `query($login: String!, $from: DateTime!, $to: DateTime!) { user(login: $login) { contributionsCollection(from: $from, to: $to) { contributionCalendar { totalContributions } } } }`,
                { login: username, from, to }
              );
              const count = yearData.user.contributionsCollection.contributionCalendar.totalContributions;
              byYear[year] = count;
              total += count;
            }
            return { total, byYear };
          }

          function patchStatsCard(totalContributions) {
            const formatted = totalContributions.toLocaleString("en-US");
            let svg = fs.readFileSync("profile/stats.svg", "utf8");
            svg = svg.replace(/Total Commits\s*(?:\([^)]*\))?\s*:/g, "Total Contributions (all time):");
            svg = svg.replace(/(Total Contributions \(all time\):)\s*[\d,]+(?=,\s*Total PRs)/g, `$1 ${formatted}`);
            svg = svg.replace(/(data-testid="commits"[\s\S]*?>)\s*[\d,]+(\s*<\/text>)/, `$1${formatted}$2`);
            fs.writeFileSync("profile/stats.svg", svg);
          }

          function escapeXml(value) {
            return String(value).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&apos;" }[c]));
          }

          function generateLanguageSvg(languages) {
            const palette = ["#178600", "#3178c6", "#e34c26", "#f1e05a", "#663399", "#3572A5", "#563d7c", "#89e051"];
            let x = 0;
            const bars = languages.map((lang, i) => {
              const width = i === languages.length - 1 ? 100 - x : lang.percent;
              const rect = `<rect x="${x}%" y="42" width="${Math.max(width, 0)}%" height="8" fill="${palette[i % palette.length]}"/>`;
              x += lang.percent;
              return rect;
            }).join("");

            const rows = languages.map((lang, i) => {
              const col = i % 2;
              const row = Math.floor(i / 2);
              const cx = col === 0 ? 10 : 165;
              const cy = 78 + row * 25;
              return `<circle cx="${cx}" cy="${cy - 4}" r="5" fill="${palette[i % palette.length]}"/><text x="${cx + 12}" y="${cy}" class="lang">${escapeXml(lang.name)} ${lang.percent.toFixed(2)}%</text>`;
            }).join("");

            return `<svg width="300" height="165" viewBox="0 0 300 165" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Most Used Languages"><style>.title{font:600 18px 'Segoe UI',Ubuntu,Sans-Serif;fill:#2f80ed}.lang{font:400 11px 'Segoe UI',Ubuntu,Sans-Serif;fill:#434d58}</style><text x="0" y="20" class="title">Most Used Languages</text><g rx="4">${bars}</g>${rows}</svg>`;
          }

          async function main() {
            const [repos, contributionStats] = await Promise.all([getRepos(), getAllTimeContributionCount()]);
            const languageTotals = new Map();
            const languageResults = await Promise.all(
              repos.map((repo) => github(`/repos/${username}/${repo.name}/languages`).catch(() => ({})))
            );

            for (const languages of languageResults) {
              for (const [name, bytes] of Object.entries(languages)) {
                languageTotals.set(name, (languageTotals.get(name) ?? 0) + Number(bytes));
              }
            }

            const totalBytes = [...languageTotals.values()].reduce((sum, bytes) => sum + bytes, 0);
            const languages = [...languageTotals.entries()]
              .map(([name, bytes]) => ({ name, percent: totalBytes > 0 ? (bytes / totalBytes) * 100 : 0 }))
              .filter((language) => language.percent >= 0.01)
              .sort((a, b) => b.percent - a.percent)
              .slice(0, 6);

            patchStatsCard(contributionStats.total);
            fs.writeFileSync("profile/top-langs.svg", generateLanguageSvg(languages));

            const data = {
              repos: repos.length,
              totalContributions: contributionStats.total,
              contributionsByYear: contributionStats.byYear,
              contributionPeriod: "allTime",
              languages: languages.map((l) => ({ name: l.name, percent: Number(l.percent.toFixed(2)) })),
              updatedAt: new Date().toISOString()
            };
            fs.writeFileSync("profile/github-stats.json", `${JSON.stringify(data, null, 2)}\n`);
          }

          main().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Commit generated stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/stats.svg profile/top-langs.svg profile/github-stats.json
          git commit -m "Update GitHub stats" || exit 0
          git push
